name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source if it was uploaded as a zip
        run: |
          if [ ! -f build.gradle ]; then
            zipfile=$(ls *.zip | head -n 1)
            echo "Unzipping $zipfile"
            unzip -o "$zipfile"
          fi
          ls -la

      - name: Set up JDK 17 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: sitandwatch-jar
          path: build/libs/*.jar
          if-no-files-found: error
